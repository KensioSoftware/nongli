---
# Publishes @kensio/nongli, when someone runs it from the Actions tab.
# What it does is decided by .releaserc.yaml; this file is the plumbing.
#
# Several things this depends on live in repository or npm settings rather than
# in any file here, so nothing in a checkout can prove they are still true. All
# five are in place as of 2026-08-15; this is the list, what breaks if one of
# them is ever undone, and where each one stands.
#
# Keep the STATUS lines honest. Four of the five can be read back from the
# GitHub API rather than taken on trust, each from its own endpoint:
#
#     item 2  gh api repos/KensioSoftware/nongli/environments
#     item 3  gh api repos/KensioSoftware/nongli/actions/permissions/workflow
#     item 4  gh api repos/KensioSoftware/nongli
#     item 5  gh api repos/KensioSoftware/nongli/rulesets
#
# Item 1, the npm trusted publisher, cannot be: npm exposes no public endpoint
# for it, so what is written below is the only record of it there is.
#
#   1. A trusted publisher on npmjs.com for @kensio/nongli, pointing at this
#      repository, this workflow file, and the "release" environment below,
#      with npm publish as the only allowed action. This is what replaces a
#      stored NPM_TOKEN — there is no npm credential in this repository.
#      Renaming this file silently invalidates it, so an authentication error
#      on publish is the first place to look.
#
#      A trusted publisher can only be attached to a package that exists, so
#      the very first publish cannot use one. That bootstrap version has to be
#      pushed by hand to create @kensio/nongli, and it is the one version that
#      will carry no provenance attestation; everything after it goes through
#      OIDC.
#      STATUS: configured, on 2026-08-15. The bootstrap publish happened the
#      same day — 0.1.0, published by hand, `latest` on the registry, and the
#      one version with no provenance attestation that there will ever be.
#
#      This is the item the note above singles out: the other four can be
#      confirmed against their endpoints, and this one cannot be confirmed at
#      all. It is written down because writing it down is the whole record.
#
#   2. A repository environment named "release". Adding a required reviewer
#      makes a publish wait for a second pair of eyes, which is worth having
#      if anyone else ever gains write access. Starting the run is already a
#      deliberate act, so approving your own run adds little on its own.
#      STATUS: created. Item 1 scopes the trusted publisher to it, and the
#      publish job below names it in `environment:`.
#
#   3. Settings → Actions → General → "Allow GitHub Actions to create and
#      approve pull requests", for the version job at the bottom. Without it
#      `gh pr create` fails with a permissions error that does not mention the
#      setting.
#      STATUS: enabled.
#
#   4. Squash as the only merge method, with "Default commit message" set to
#      "Pull request title". Everything below assumes a commit on main is a
#      pull request title, because that is what semantic-release reads and what
#      the release notes are made of. A merge commit or a rebase merge puts
#      subjects on main that pr.yml never checked, so re-enabling either one
#      quietly removes the guarantee the Title check exists to give.
#      STATUS: set, on 2026-08-15. Squash is the only method — merge commits
#      and rebase merges are both off — and the subject is `PR_TITLE`, so the
#      string pr.yml checked is the string that lands. The Title check reads
#      this setting from the API rather than assuming it, so it follows along
#      if this is ever changed back.
#
#      The squash *body* is `BLANK` rather than the commit messages, which is
#      the part worth not changing casually. Concatenating the branch's commit
#      messages into the body puts their footers on main, and
#      commit-analyzer reads footers: one `BREAKING CHANGE:` on some
#      intermediate commit would be read as a major, which .releaserc.yaml
#      then refuses outright. A whole release fails on a footer nobody meant
#      to publish. Blank cannot do that.
#
#   5. A ruleset on main requiring the Lint, Test and Build checks. Several
#      comments below explain themselves in terms of it — in particular why the
#      version job opens a pull request rather than pushing.
#      STATUS: active on the default branch as of 2026-08-15, requiring Lint,
#      Test and Build. That is all it requires — there is no pull-request rule
#      on it, and nothing refusing deletion or a non-fast-forward push. So the
#      three checks are enforced and the shape of how a change arrives is not.
#      Worth knowing before reading the version job at the bottom, which opens
#      a pull request rather than pushing: it does that because a commit made
#      inside that run has no checks on it, which this ruleset would reject.
#      That reasoning holds under the ruleset as configured.

name: Release

on:
  # Started by hand, not by merging. Pull requests land here in bursts, and
  # publishing each one would put a version on the registry that nobody
  # installs any sooner: pnpm v11 holds new versions back for a day by
  # default. One run ships everything accumulated since the last tag, as a
  # single version with one set of release notes.
  #
  # Running this from a branch other than main is harmless — .releaserc.yaml
  # releases from main only, so semantic-release finds nothing to do.
  #
  # The 0.x line needs an annotated tag to anchor it, and v0.1.0 was put in
  # place on 2026-08-15, on the commit that squashed #1. v0.2.0 followed on
  # 2026-09-02.
  #
  # Why a tag and not something easier: semantic-release starts at 1.0.0 when
  # it finds none, whatever the commit subjects say and whatever version
  # package.json holds. The `version` field would not have held the line on its
  # own, and neither does the hand-published 0.1.0 on npm — that is a registry
  # entry, not a tag, and semantic-release never looks at it. Deleting the tag
  # would put the next run back to 1.0.0.
  #
  # This is enforced rather than left to memory: .releaserc.yaml fails the run
  # when there is no previous release to count from, which is exactly the state
  # that produces 1.0.0. Worth knowing why that guard is separate from the one
  # refusing majors — with no tag, semantic-release returns its first-release
  # constant without bumping anything, so the version is 1.0.0 while the type
  # is still `patch`, and a guard reading the type sees nothing wrong.
  #
  # Leaving 0.x is the dropdown below set to major, and nothing else. A patch
  # and a minor both stay on the line, so the only way off it is somebody
  # choosing it from a form. .releaserc.yaml still refuses a major that a
  # `feat!:` or a BREAKING CHANGE footer reached on its own, which is the part
  # that was ever worth guarding: a version number that says consumers have to
  # rewrite something is a decision, not a consequence of a subject line.
  workflow_dispatch:
    inputs:
      release_type:
        description: >-
          How far to bump. Patch leaves it to the commit subjects, which is
          what everything releasable earns on its own. Minor and major raise
          it, and a major is the only way off the 0.x line.
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

defaults:
  run:
    shell: bash

env:
  CI: true

# One release at a time, and never cancelled part-way: a run killed between
# pushing the tag and publishing the tarball leaves a version that exists in
# git and not on the registry, which is awkward to unpick.
concurrency:
  group: release
  cancel-in-progress: false

# Nothing is granted by default; each job below asks for the scopes it needs
# and no more.
permissions: {}

# The checks pr.yml already ran, run again against main, and then publish.
#
# Re-running them is not belt and braces. A ruleset can require a pull request
# to be up to date with main before it merges, but "up to date" is measured when
# the merge happens and this run may be days later — long enough for another
# pull request to have landed a change that only conflicts with this one
# semantically, which no merge check can see.
#
# They are separate jobs from the publish because three jobs cost the slowest of
# them rather than the sum. The check names are deliberately not the bare
# "Lint"/"Test"/"Build" that pr.yml uses: those three are the names intended as
# main's required checks, and a ruleset matches a check by name whatever
# workflow posted it, so a release dispatched from a branch with an open pull
# request would otherwise report into that pull request's gate. True whether or
# not the ruleset of item 5 exists yet, so the distinct names are worth keeping
# either way.
#
# Spelled out rather than calling `pnpm check`, which starts with `pnpm fmt`
# and rewrites files instead of reporting on them. Keep these jobs and the ones
# in pr.yml in step with each other.
jobs:
  lint:
    name: Release lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are pinned to commit SHAs rather than the tags pr.yml uses. A
      # tag can be moved to point at new code, which is how the
      # tj-actions/changed-files compromise reached the repositories using it;
      # a SHA cannot. It matters here and not there because this is the
      # workflow that mints a credential to publish under this package's name.
      # The trailing comment is the tag each SHA was resolved from, so a bump
      # is still readable in review.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci
      - run: pnpm fta
      - run: pnpm docs:check

  # The same single runtime pr.yml proves, for the same reason: `engines` and
  # .nvmrc name the same Node, because `Temporal` is what sets the floor.
  test:
    name: Release test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

  build:
    name: Release build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:check
      - run: pnpm build
      # The last gate before a stale dist/ reaches the registry: builds the
      # real tarball and checks what is in it. The release job below builds its
      # own through prepack rather than taking this one — that check proves the
      # build packs correctly, it does not hand anything on.
      - run: pnpm pack:check

  release:
    name: Release
    # Nothing runs here until every check above is green. They check out the
    # same commit this one publishes, so a green check is a statement about the
    # tarball semantic-release is about to build.
    needs: [lint, test, build]

    runs-on: ubuntu-latest

    # What the npm trusted publisher is scoped to, and where any approval
    # requirement lives. See the note at the top of this file.
    environment: release

    permissions:
      # Push the tag and create the GitHub Release.
      contents: write
      # Mint the OIDC token npm exchanges for a short-lived publish
      # credential. Without this, @semantic-release/npm falls back to looking
      # for an NPM_TOKEN and fails.
      id-token: write

    # Empty when the commits since the last tag were only chore/test/docs, and
    # nothing was published. The version job below reads it to decide whether
    # there is anything to write down.
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # semantic-release works out the next version by reading the
          # existing tags, so a shallow clone would have it start from zero.
          fetch-depth: 0
          # semantic-release authenticates its own push with GITHUB_TOKEN, so
          # leaving checkout's credential in .git/config only widens what a
          # later step could use.
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Decides the version, builds the release notes out of the commit
      # subjects since the last tag, publishes to npm, tags, and writes the
      # GitHub Release with those notes as its body. Does nothing at all if
      # those commits are only chore/test/docs. See .releaserc.yaml.
      - id: release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read by analyzeCommitsCmd in .releaserc.yaml, which raises the
          # release to this when it is minor or major, and leaves the commit
          # subjects to decide on patch. verifyReleaseCmd reads it too, to tell
          # a major somebody chose from one a commit subject reached by itself.
          RELEASE_TYPE: ${{ inputs.release_type }}

  # `version` in package.json, caught up to what was just published, and sent
  # to main as a pull request.
  #
  # A pull request rather than a push, because main's intended ruleset requires
  # three passing status checks and a commit created inside this run has none.
  # pr.yml runs those three on pushes to `release/**` for exactly this reason.
  # It is also the right shape with no ruleset in place, so this does not wait
  # on one.
  #
  # That number is not what the released version *is* — the tag and the
  # registry are that, and both already exist by the time this runs. So a
  # failure here, or a pull request left unmerged, costs a stale package.json
  # and nothing else. It does not cost a broken release, and nothing about the
  # next one depends on it having been merged: semantic-release reads the tags.
  version:
    name: Write the version back
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      # Pushing the branch.
      contents: write
      # Opening the pull request.
      pull-requests: write
    steps:
      # The one job here that keeps checkout's credential, because it is the
      # one that pushes. It holds no npm credential and publishes nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      # For `npm pkg set` below, and so that the version of npm rewriting
      # package.json is the one everyone else's edits go through.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Commit and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail

          npm pkg set version="$VERSION"

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Nothing changed. Already written back?"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="release/v$VERSION"
          git switch --create "$branch"
          git add package.json
          git commit --message "chore: version $VERSION"
          git push origin "$branch"

          # --body-file rather than --body, so the markdown below is not at the
          # mercy of how this block is indented.
          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          [$VERSION](https://github.com/KensioSoftware/nongli/releases/tag/v$VERSION) is published. This is the part of it that belongs on main: \`version\` in package.json caught up to it.

          Nothing depends on this being merged — the tag and the registry are the version of record, and the next release works out its own number from the tags rather than from this file.
          EOF

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: version $VERSION" \
            --body-file "$RUNNER_TEMP/pr-body.md"
